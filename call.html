<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmberCalls - Call Room</title>
    <style>
        body { background: #0a0000; color: white; font-family: Arial; text-align: center; margin: 0; padding: 20px; }
        video { width: 45%; background: black; margin: 10px; border-radius: 10px; border: 2px solid #ff3b3b; }
        button { padding: 15px 30px; background: #ff3b3b; color: white; border: none; font-size: 18px; cursor: pointer; margin: 10px; }
        #status { font-size: 20px; margin: 15px; }
    </style>
</head>
<body>
    <h1>🔴 Live Call Room</h1>
    <div id="status">Connecting to call...</div>
    
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <br><br>
    <button onclick="endCall()">End Call</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const token = localStorage.getItem("token");
        const roomId = localStorage.getItem("roomId");
        const sessionId = localStorage.getItem("sessionId");
        const iceServers = JSON.parse(localStorage.getItem("iceServers") || "[]");

        const socket = io();
        let localStream, peerConnection;

        async function startCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById("localVideo").srcObject = localStream;

                peerConnection = new RTCPeerConnection({ iceServers: iceServers });

                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = e => {
                    document.getElementById("remoteVideo").srcObject = e.streams[0];
                };

                peerConnection.onicecandidate = e => {
                    if (e.candidate) socket.emit("ice-candidate", { roomId, candidate: e.candidate });
                };

                socket.emit("join-room", roomId);

                socket.on("user-joined", async () => {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit("offer", { roomId, offer });
                });

                socket.on("offer", async (offer) => {
                    await peerConnection.setRemoteDescription(offer);
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit("answer", { roomId, answer });
                });

                socket.on("answer", async (answer) => {
                    await peerConnection.setRemoteDescription(answer);
                });

                socket.on("ice-candidate", async (data) => {
                    try { await peerConnection.addIceCandidate(data.candidate); } catch (err) {}
                });

                socket.on("user-left", () => { alert("The other user left the call"); endCall(); });

                setInterval(deductMinute, 60000);
                document.getElementById("status").innerText = "✅ Call Connected - Credits deducting every minute";
            } catch (err) {
                console.error(err);
                alert("Could not access camera/microphone");
            }
        }

        async function deductMinute() {
            const res = await fetch("/api/deduct-minute", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ sessionId })
            });
            const data = await res.json();
            if (!data.success) {
                alert(data.error || "Not enough credits");
                endCall();
            }
        }

        async function endCall() {
            socket.emit("leave-room", roomId);
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            await fetch("/api/end-call", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ sessionId })
            });
            window.location.href = "/";
        }

        startCall();
    </script>
</body>
</html>
