<!DOCTYPE html>
<html>
<head>
<title>EmberCalls</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { 
        font-family: Arial; 
        background: #140000; 
        color: white; 
        padding: 15px; 
        margin: 0;
    }
    input, textarea, button { 
        display: block; 
        margin: 12px auto; 
        padding: 14px; 
        width: 90%; 
        max-width: 400px; 
        font-size: 16px;
    }
    button { 
        background: #ff3b3b; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
    }
    .card { 
        background: #2a0000; 
        padding: 15px; 
        margin: 15px auto; 
        border-radius: 10px; 
        max-width: 400px; 
    }
    h1, h2 { text-align: center; }
    video { width: 100%; max-width: 100%; background: black; margin: 10px 0; border-radius: 10px; }
</style>
</head>
<body>
<h1>EmberCalls 🔥</h1>

<h2>Register</h2>
<input id="regEmail" placeholder="Email" type="email">
<input id="regPassword" placeholder="Password" type="password">
<button onclick="register()">Register</button>

<h2>Login</h2>
<input id="loginEmail" placeholder="Email" type="email">
<input id="loginPassword" placeholder="Password" type="password">
<button onclick="login()">Login</button>

<h2>My Account</h2>
<button onclick="loadMe()">Refresh Account</button>
<p id="account" style="text-align:center;"></p>

<h2>Buy Credits</h2>
<button onclick="buyCredits('10min')">Buy 10 min (R29.99)</button>
<button onclick="buyCredits('60min')">Buy 60 min (R149.99)</button>
<button onclick="buyCredits('360min')">Buy 360 min (R499.99)</button>

<h2>Create Creator Profile</h2>
<input id="displayName" placeholder="Display name">
<textarea id="bio" placeholder="Bio" rows="3"></textarea>
<input id="rate" placeholder="Rate per minute (credits)" type="number">
<button onclick="createCreator()">Create Profile</button>

<h2>Available Creators</h2>
<button onclick="loadCreators()">Load Creators</button>
<div id="creators"></div>

<script>
// Paste your JavaScript functions here (register, login, etc.)
// You can copy them from the previous version
let token = localStorage.getItem("token");

async function api(url, method = "GET", body = null) {
  const res = await fetch(url, {
    method,
    headers: {
      "Content-Type": "application/json",
      "Authorization": token ? `Bearer ${token}` : ""
    },
    body: body ? JSON.stringify(body) : null
  });
  return res.json();
}

// ... (add the rest of your JS functions: register, login, loadMe, buyCredits, etc.)
</script>
</body>
</html>
