<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmberCalls</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; padding:40px 20px; background:linear-gradient(135deg,#2a0000,#4a0000,#1a0000); color:white; font-family:Arial,sans-serif; text-align:center; min-height:100vh; }
    h1 { font-size:48px; color:#ffd700; }
    .tagline { font-size:24px; color:#ffd700; margin:20px 0; }
    input, button { padding:15px; margin:10px; width:80%; max-width:400px; border-radius:50px; font-size:18px; }
    button { background:#ffd700; color:#2a0000; border:none; cursor:pointer; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <h1>🔥 EmberCalls</h1>
  <p class="tagline">Private Desires. Premium Earnings.</p>

  <div id="auth-section">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <br>
    <button onclick="signUp()">Sign Up as Creator</button>
    <button onclick="signIn()">Sign In</button>
  </div>

  <div id="app-section" class="hidden">
    <h2>Welcome to EmberCalls!</h2>
    <p>You are logged in.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    const supabaseUrl = 'https://xxcidnwdmnhjyibbizve.supabase.co';
    const supabaseKey = 'sb_publishable_icko5NLukyFvJUSrLs_aeg_AMIln8tO';
    const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) return alert("Fill email and password");

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) alert(error.message);
      else alert("Account created! Check your email to confirm.");
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else showApp();
    }

    function showApp() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    // Check if already logged in
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) showApp();
    });
  </script>
</body>
</html>
