<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmberCalls - Premium Adult Video Calls</title>
  <script src="https://js.yoco.com/sdk/v1/yoco-sdk-web.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      background: linear-gradient(135deg, #6a0000, #ff0088, #4a0000); 
      color: white; 
      font-family: Arial, sans-serif; 
      min-height: 100vh; 
    }
    .header { 
      background: rgba(0,0,0,0.85); 
      padding: 20px; 
      text-align: center; 
      border-bottom: 5px solid #ffd700; 
    }
    h1 { color: #ffd700; font-size: 38px; text-shadow: 0 0 20px #ff00aa; }
    .nav { 
      background: rgba(0,0,0,0.7); 
      padding: 15px; 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: center; 
      gap: 12px; 
    }
    button { 
      padding: 16px 28px; 
      margin: 6px; 
      background: linear-gradient(#ffd700, #ffaa00); 
      color: #2a0000; 
      border: none; 
      border-radius: 50px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 17px; 
      box-shadow: 0 6px 20px rgba(255,215,0,0.5); 
    }
    .section { padding: 25px; max-width: 900px; margin: 0 auto; display: none; }
    .active { display: block; }
    .video-container { background: #000; position: relative; margin: 20px 0; border-radius: 20px; overflow: hidden; box-shadow: 0 0 40px rgba(255,0,170,0.6); }
    video { width: 100%; max-height: 420px; background: #111; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🔥 EmberCalls</h1>
    <p>Premium Private Adult Video Calls • Creators Keep 75%</p>
  </div>

  <div class="nav">
    <button onclick="showSection('home')">🏠 Home</button>
    <button onclick="showSection('models')">💃 Become Model</button>
    <button onclick="showSection('live')">📹 Live Video</button>
    <button onclick="showSection('wallet')">💰 Buy Minutes</button>
  </div>

  <!-- Home -->
  <div id="home" class="section active">
    <h2>Welcome to EmberCalls</h2>
    <p style="font-size:22px; margin:25px 0;">Real Video Calls + Instant Payments via Yoco</p>
    <button onclick="showSection('live')">Go Live</button>
    <button onclick="showSection('wallet')">Buy Minutes</button>
    <button onclick="showSection('models')">Join as Creator</button>
  </div>

  <!-- Become Model -->
  <div id="models" class="section">
    <h2>Become a Creator / Model</h2>
    <input type="text" id="mname" placeholder="Stage Name">
    <input type="email" id="memail" placeholder="Email">
    <textarea id="mbio" rows="4" placeholder="Bio + what you offer"></textarea>
    <input type="text" id="mrate" placeholder="Rate per minute (e.g. R120)">
    <button onclick="registerModel()">Submit Application</button>
  </div>

  <!-- Live Video -->
  <div id="live" class="section">
    <h2>🔴 Live Video Streaming</h2>
    <div class="video-container">
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <button onclick="startCamera()">Start My Camera</button>
    <button onclick="stopCamera()">Stop Camera</button>
    <button onclick="startPrivateCall()">Start Private Call</button>
  </div>

  <!-- Wallet -->
  <div id="wallet" class="section">
    <h2>Buy Minutes with Yoco</h2>
    <button onclick="payWithYoco(50)">Pay R50 - 10 Minutes</button>
    <button onclick="payWithYoco(100)">Pay R100 - 25 Minutes</button>
    <button onclick="payWithYoco(200)">Pay R200 - 60 Minutes</button>
  </div>

  <script>
    let localStream = null;
    const video = document.getElementById('localVideo');

    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    async function startCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        video.srcObject = localStream;
        alert("✅ Camera started! Real video streaming active.");
      } catch (err) {
        alert("Camera access denied.");
      }
    }

    function stopCamera() {
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }

    function registerModel() {
      const name = document.getElementById('mname').value;
      if (name) {
        alert(`✅ Application received for ${name}!\n\nWe will review and contact you on WhatsApp (079 130 8270).`);
        showSection('home');
      } else {
        alert("Please enter stage name");
      }
    }

    function startPrivateCall() {
      alert("🔴 Starting Private 1-on-1 Call...\n\nUse the camera above. In full version this connects two users.");
    }

    // Yoco Payment
    function payWithYoco(amount) {
      const yoco = new YocoSDK({
        publicKey: "pk_test_c5d37cf8GNyWRdy7ecd4"
      });

      yoco.showPopup({
        amountInCents: amount * 100,
        currency: 'ZAR',
        name: 'EmberCalls',
        description: `${amount} Minutes - Private Video Call Credits`,
        onSuccess: (result) => {
          alert(`✅ Payment Successful!\nTransaction ID: \( {result.id}\n \){amount} minutes added automatically!`);
        },
        onError: (error) => {
          alert("Payment failed: " + error.message);
        }
      });
    }

    window.onload = () => showSection('home');
  </script>
</body>
</html>
