<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmberCalls - Live Adult Video Calls</title>
  <style>
    body { margin:0; padding:0; background:#1a0000; color:white; font-family:Arial,sans-serif; }
    .header { background:#2a0000; padding:15px; text-align:center; }
    h1 { color:#ffd700; margin:0; }
    .container { display:flex; flex-direction:column; height:100vh; }
    .main { flex:1; display:flex; }
    .video-area { flex:2; background:#000; position:relative; display:flex; align-items:center; justify-content:center; }
    .chat { flex:1; background:#2a0000; display:flex; flex-direction:column; }
    .messages { flex:1; padding:15px; overflow-y:auto; }
    .message { margin:8px 0; padding:8px; border-radius:10px; background:#3a0000; }
    .input-area { padding:10px; background:#1a0000; }
    input { width:70%; padding:12px; border-radius:30px; border:none; }
    button { padding:12px 20px; background:#ffd700; color:#2a0000; border:none; border-radius:30px; font-weight:bold; }
    .tip-btn { background:#ff00aa; color:white; padding:8px 16px; margin:5px; border-radius:20px; }
    .live-dot { color:#ff0000; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>🔥 EmberCalls Live</h1>
    <p>Private Adult Video Calls &amp; Live Shows</p>
  </div>

  <div class="container">
    <div class="main">
      <!-- Video Area -->
      <div class="video-area">
        <div style="text-align:center; color:#ffd700;">
          <div style="font-size:80px;">📹</div>
          <h2><span class="live-dot">●</span> LIVE with <span id="current-creator">SexyMia</span></h2>
          <p id="timer" style="font-size:28px; margin:15px 0;">00:00</p>
          <button onclick="sendTip(50)">Tip R50</button>
          <button onclick="sendTip(100)">Tip R100</button>
          <button onclick="sendTip(200)">Tip R200</button>
        </div>
      </div>

      <!-- Chat -->
      <div class="chat">
        <div class="messages" id="chat-messages">
          <div class="message"><strong>SexyMia:</strong> Hey baby 😘 What do you want to see?</div>
          <div class="message"><strong>Fan123:</strong> Take it off 🔥</div>
        </div>
        
        <div class="input-area">
          <input type="text" id="chat-input" placeholder="Type a message or tip...">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div style="background:#2a0000; padding:15px; text-align:center;">
      <button onclick="startPrivateCall()">Start Private 1-on-1 Call</button>
      <button onclick="buyMinutes()">Buy Minutes (R50 = 10min)</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
    let minutes = 45;
    let callTimer = null;

    function updateMinutes() {
      // Could show in header if wanted
    }

    function sendTip(amount) {
      if (minutes >= amount/10) {
        minutes -= amount/10;
        alert(`💰 Tip R${amount} sent! Creator received it.`);
      } else {
        alert("Not enough minutes. Buy more first.");
      }
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      if (input.value.trim() === "") return;
      
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.innerHTML = `<strong>You:</strong> ${input.value}`;
      document.getElementById('chat-messages').appendChild(msg);
      document.getElementById('chat-messages').scrollTop = 9999;
      input.value = "";
    }

    function startPrivateCall() {
      alert("🔴 Starting private 1-on-1 call...\n\nYour minutes will be deducted live.");
      const duration = 300; // 5 minutes demo
      let timeLeft = duration;
      
      if (callTimer) clearInterval(callTimer);
      
      callTimer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `\( {Math.floor(timeLeft/60)}: \){(timeLeft%60).toString().padStart(2,'0')}`;
        
        if (timeLeft <= 0) {
          clearInterval(callTimer);
          alert("Call ended. Thank you!");
        }
      }, 1000);
    }

    function buyMinutes() {
      const amount = prompt("How much do you want to pay? (R50 = 10 minutes)", "100");
      if (amount) {
        const minsAdded = Math.floor(amount / 5);
        minutes += minsAdded;
        alert(`Payment of R\( {amount} received!\n \){minsAdded} minutes added.\n\nSend money to: 079 130 8270 (Capitec)`);
      }
    }

    function logout() {
      if (confirm("Logout?")) location.reload();
    }

    // Auto demo messages
    setInterval(() => {
      const messages = ["Damn you're hot 🔥", "More please!", "Tip sent!"];
      const randomMsg = document.createElement('div');
      randomMsg.className = 'message';
      randomMsg.innerHTML = `<strong>Fan${Math.floor(Math.random()*99)}:</strong> ${messages[Math.floor(Math.random()*messages.length)]}`;
      document.getElementById('chat-messages').appendChild(randomMsg);
      document.getElementById('chat-messages').scrollTop = 9999;
    }, 8000);

    // Keyboard support for chat
    document.getElementById('chat-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
