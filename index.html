<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmberCalls</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: linear-gradient(135deg, #2a0000, #4a0000, #1a0000);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      min-height: 100vh;
    }
    h1 { font-size: 52px; color: #ffd700; margin: 20px 0 10px; }
    .tagline { font-size: 26px; color: #ffd700; margin-bottom: 30px; }
    p { font-size: 20px; max-width: 600px; margin: 15px auto; }
    button {
      margin: 30px 10px;
      padding: 15px 40px;
      font-size: 20px;
      background: #ffd700;
      color: #2a0000;
      border: none;
      border-radius: 50px;
      cursor: pointer;
    }
    input {
      padding: 15px;
      font-size: 18px;
      width: 80%;
      max-width: 400px;
      margin: 10px auto;
      border-radius: 50px;
      border: none;
    }
  </style>
</head>
<body>
  <h1>🔥 EmberCalls</h1>
  <p class="tagline">Private Desires. Premium Earnings.</p>
  <p><strong>18+ Only • Premium 1-on-1 Adult Video Calls</strong></p>
  <p>Creators keep more money. Fans get better private experiences.</p>

  <input type="email" id="email" placeholder="Enter your email for early access">
  <br>
  <button onclick="joinWaitlist()">Join Waiting List</button>
  <button onclick="enterSite()">Enter Site</button>

  <script>
    function joinWaitlist() {
      const email = document.getElementById('email').value;
      if (email) {
        alert("Thank you! You've been added to the waiting list 🔥\n\nWe'll notify you when EmberCalls launches.");
      } else {
        alert("Please enter your email");
      }
    }
    function enterSite() {
      alert("Welcome to EmberCalls! 🔥\n\nThe full app is being built. More features coming soon.");
    }
  </script>
</body>
</html>
