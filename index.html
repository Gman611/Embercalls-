<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmberCalls</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; padding:40px 20px; background:linear-gradient(135deg,#2a0000,#4a0000,#1a0000); color:white; font-family:Arial,sans-serif; text-align:center; min-height:100vh; }
    h1 { font-size:48px; color:#ffd700; }
    .tagline { font-size:24px; color:#ffd700; margin:20px 0; }
    input, button { padding:15px; margin:10px; width:80%; max-width:400px; border-radius:50px; font-size:18px; }
    button { background:#ffd700; color:#2a0000; border:none; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>
  <h1>🔥 EmberCalls</h1>
  <p class="tagline">Private Desires. Premium Earnings.</p>

  <div id="auth-section">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <br><br>
    <button onclick="signUp()">Sign Up as Creator</button>
    <button onclick="signIn()">Sign In</button>
  </div>

  <div id="app-section" style="display:none;">
    <h2>Welcome!</h2>
    <p>You are logged in. More features coming soon.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    const supabaseUrl = 'https://xxcidnwdmnhjyibbizve.supabase.co';
    const supabaseKey = 'sb_publishable_icko5NLukyFvJUSrLs_aeg_AMIln8tO';
    const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) return alert("Please fill email and password");

      const { data, error } = await supabase.auth.signUp({ 
        email, 
        password,
        options: { emailRedirectTo: window.location.href }
      });

      if (error) {
        alert("Error: " + error.message);
      } else {
        alert("Account created! Please check your email (" + email + ") and click the confirmation link.");
      }
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert("Sign in failed: " + error.message);
      else {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
      }
    }

    function logout() {
      supabase.auth.signOut();
      location.reload();
    }
  </script>
</body>
</html>
