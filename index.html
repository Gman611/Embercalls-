<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmberCalls</title>
    <style>
        body { font-family: Arial, sans-serif; background: #140000; color: white; padding: 20px; margin: 0; }
        input, textarea, button { display: block; margin: 10px 0; padding: 12px; width: 300px; border-radius: 6px; }
        button { background: #ff3b3b; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff5555; }
        .card { background: #2a0000; padding: 15px; margin: 15px 0; border-radius: 10px; max-width: 400px; }
        #appSection { display: none; }
    </style>
</head>
<body>
    <h1>🔥 EmberCalls</h1>

    <div id="authSection">
        <h2>Register</h2>
        <input id="regEmail" placeholder="Email" type="email">
        <input id="regPassword" placeholder="Password" type="password">
        <button onclick="register()">Register</button>

        <h2>Login</h2>
        <input id="loginEmail" placeholder="Email" type="email">
        <input id="loginPassword" placeholder="Password" type="password">
        <button onclick="login()">Login</button>
    </div>

    <div id="appSection">
        <h2>Account</h2>
        <p id="account"></p>
        <button onclick="loadMe()">Refresh Account</button>
        <button onclick="logout()">Logout</button>

        <h2>Buy Credits (Demo)</h2>
        <button onclick="buyCredits('10min')">10 min - 85 credits</button>
        <button onclick="buyCredits('60min')">60 min - 415 credits</button>
        <button onclick="buyCredits('360min')">360 min - 1650 credits</button>

        <h2>Create Creator Profile</h2>
        <input id="displayName" placeholder="Display Name">
        <textarea id="bio" placeholder="Bio (optional)"></textarea>
        <input id="rate" placeholder="Rate per minute (credits)" type="number">
        <button onclick="createCreator()">Create Creator Profile</button>

        <h2>Available Creators</h2>
        <button onclick="loadCreators()">Load Creators</button>
        <div id="creators"></div>
    </div>

    <script>
        let token = localStorage.getItem("token");

        async function api(url, method = "GET", body = null) {
            const headers = { "Content-Type": "application/json" };
            if (token) headers.Authorization = `Bearer ${token}`;
            const res = await fetch(url, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
            });
            return res.json();
        }

        async function register() {
            const data = await api("/api/register", "POST", {
                email: document.getElementById("regEmail").value,
                password: document.getElementById("regPassword").value
            });
            if (data.token) {
                token = data.token;
                localStorage.setItem("token", token);
                showApp();
            }
            alert(JSON.stringify(data));
        }

        async function login() {
            const data = await api("/api/login", "POST", {
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value
            });
            if (data.token) {
                token = data.token;
                localStorage.setItem("token", token);
                showApp();
            }
            alert(JSON.stringify(data));
        }

        function showApp() {
            document.getElementById("authSection").style.display = "none";
            document.getElementById("appSection").style.display = "block";
            loadMe();
            loadCreators();
        }

        async function loadMe() {
            const data = await api("/api/me");
            document.getElementById("account").innerText = `Email: ${data.email || 'N/A'} | Credits: ${data.credits || 0}`;
        }

        async function buyCredits(packageName) {
            const data = await api("/api/buy-credits-demo", "POST", { packageName });
            alert(JSON.stringify(data));
            loadMe();
        }

        async function createCreator() {
            const data = await api("/api/creator", "POST", {
                displayName: document.getElementById("displayName").value,
                bio: document.getElementById("bio").value,
                ratePerMinute: Number(document.getElementById("rate").value)
            });
            alert(JSON.stringify(data));
        }

        async function loadCreators() {
            const data = await api("/api/creators");
            const container = document.getElementById("creators");
            container.innerHTML = "";
            data.forEach(c => {
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `
                    <h3>${c.display_name}</h3>
                    <p>${c.bio || ''}</p>
                    <p><strong>${c.rate_per_minute} credits / min</strong></p>
                    <button onclick="startCall(${c.id})">Start Video Call</button>
                `;
                container.appendChild(div);
            });
        }

        async function startCall(creatorId) {
            const data = await api("/api/start-call", "POST", { creatorId });
            if (!data.success) {
                alert(JSON.stringify(data));
                return;
            }
            localStorage.setItem("roomId", data.roomId);
            localStorage.setItem("sessionId", data.session.id);
            localStorage.setItem("iceServers", JSON.stringify(data.iceServers));
            window.location.href = "call.html";
        }

        function logout() {
            localStorage.removeItem("token");
            location.reload();
        }

        // Auto login if token exists
        if (token) showApp();
    </script>
</body>
</html>
