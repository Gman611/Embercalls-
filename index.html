<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmberCalls - Premium Adult Video Calls</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; padding:20px; background:linear-gradient(135deg,#2a0000,#4a0000,#1a0000); color:white; font-family:Arial,sans-serif; text-align:center; min-height:100vh; }
    h1 { font-size:42px; color:#ffd700; }
    button { padding:15px 30px; margin:10px; font-size:18px; background:#ffd700; color:#2a0000; border:none; border-radius:50px; cursor:pointer; width:80%; max-width:400px; }
    input { padding:15px; margin:10px; width:80%; max-width:400px; border-radius:50px; }
    .section { display:none; }
    .active { display:block; }
  </style>
</head>
<body>
  <h1>🔥 EmberCalls</h1>
  <p id="status">Loading...</p>

  <!-- Auth Screen -->
  <div id="auth" class="section active">
    <input type="email" id="email" placeholder="Email" value="gerriekayser17@gmail.com">
    <input type="password" id="password" placeholder="Password">
    <button onclick="signUp()">Sign Up as Creator</button>
    <button onclick="signIn()">Sign In</button>
  </div>

  <!-- Main App -->
  <div id="app" class="section">
    <p>Welcome, <span id="username">User</span>!</p>
    <p>Minutes left: <strong id="minutes">0</strong></p>

    <button onclick="addMinutes()">Buy Minutes (R50 = 10 min)</button>
    <button onclick="showCreators()">Browse Creators</button>
    <button onclick="startCall()">Start Simulated Call</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Creators List -->
  <div id="creators-list" class="section">
    <h2>Available Creators</h2>
    <button onclick="bookCall(1)">Creator A - R100/min</button>
    <button onclick="bookCall(2)">Creator B - R80/min</button>
  </div>

  <script>
    let currentUser = { minutes: 30, role: "fan" };
    let balance = 30; // minutes

    function updateUI() {
      document.getElementById('minutes').textContent = balance;
    }

    function signUp() {
      alert("Account created! (Simulation)\nYou are now a Creator.");
      document.getElementById('auth').classList.remove('active');
      document.getElementById('app').classList.add('active');
      updateUI();
    }

    function signIn() {
      alert("Signed in successfully! (Simulation)");
      document.getElementById('auth').classList.remove('active');
      document.getElementById('app').classList.add('active');
      updateUI();
    }

    function addMinutes() {
      const amount = prompt("How much do you want to pay? (R50 = 10 minutes)", "50");
      if (amount) {
        balance += 10;
        alert(`Payment received! R${amount} added.\nYou now have ${balance} minutes.`);
        updateUI();
        // In real version, this would link to PayFast / bank
      }
    }

    function showCreators() {
      document.getElementById('app').classList.remove('active');
      document.getElementById('creators-list').classList.add('active');
    }

    function bookCall(creator) {
      const minutes = parseInt(prompt("How many minutes do you want to call? (You have " + balance + ")", "5"));
      if (minutes && minutes <= balance) {
        balance -= minutes;
        alert(`Call booked with Creator ${creator} for ${minutes} minutes!\nTimer will start.`);
        updateUI();
        setTimeout(() => startCall(), 1000);
      } else {
        alert("Not enough minutes or invalid amount.");
      }
    }

    function startCall() {
      const duration = parseInt(prompt("Call duration in minutes?", "5"));
      if (duration) {
        alert(`🔴 Video Call Started!\nTimer running for ${duration} minutes...`);
        setTimeout(() => {
          alert("Call ended. You earned simulation credits.");
        }, 5000);
      }
    }

    function logout() {
      location.reload();
    }

    // Auto start in demo mode
    window.onload = () => {
      document.getElementById('status').style.display = 'none';
      // For demo, auto show app
      setTimeout(() => {
        document.getElementById('auth').classList.remove('active');
        document.getElementById('app').classList.add('active');
        updateUI();
      }, 800);
    };
  </script>
</body>
</html>
